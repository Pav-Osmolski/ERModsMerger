name: Publish v1.4.0 Final

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-v1.4.0
  cancel-in-progress: true

jobs:
  release:
    if: github.event.head_commit.message == 'Publish ERModsMerger v1.4.0 release'
    runs-on: windows-latest

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v7
        with:
          ref: 7a377cc0fae8d9c30856a520a60a28bbf2a65f87
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build release package
        shell: pwsh
        run: ./tools/Build-ReleasePackage.ps1 -VersionLabel "v1.4.0"

      - name: Create tag and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 artifacts/release/*.zip --repo "$env:GITHUB_REPOSITORY" --target 7a377cc0fae8d9c30856a520a60a28bbf2a65f87 --title "ERModsMerger v1.4.0" --notes-file Documentation/ReleaseNotes-v1.4.0.md --latest

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-v1.4.0
          if-no-files-found: error
          retention-days: 30
          path: artifacts/release/*.zip
