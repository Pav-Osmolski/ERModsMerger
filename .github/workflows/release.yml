name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Generate Assets.zip
        shell: pwsh
        run: ./tools/Build-AssetsArchive.ps1

      - name: Validate regulation assets
        shell: pwsh
        run: ./tools/Test-RegulationAssets.ps1

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        run: dotnet build ERModsMerger.sln --configuration Release --no-restore --warnaserror

      - name: Test fast merge semantics
        run: >-
          dotnet test ERModsMerger.Core.Tests/ERModsMerger.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=SlowIntegration"

      - name: Build compact release package
        shell: pwsh
        run: |
          $label = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "manual-${{ github.sha }}" }
          ./tools/Build-ReleasePackage.ps1 -VersionLabel $label

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/release/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release/*.zip
