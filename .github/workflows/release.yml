name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        run: dotnet build ERModsMerger.sln --configuration Release --no-restore --warnaserror

      # The solution build generates Assets.zip once via Directory.Build.targets.
      - name: Validate regulation assets
        shell: pwsh
        run: ./tools/Test-RegulationAssets.ps1

      - name: Test fast merge semantics
        run: >-
          dotnet test ERModsMerger.Core.Tests/ERModsMerger.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=SlowIntegration"

      - name: Build compact release package
        shell: pwsh
        run: |
          $label = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "manual-${{ github.sha }}" }
          ./tools/Build-ReleasePackage.ps1 -VersionLabel $label

      - name: Prepare release notes from changelog
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $changeLog = Get-Content "Documentation/ChangeLog.md" -Raw
          $escapedTag = [regex]::Escape($tag)
          $pattern = "(?ms)^##\s+$escapedTag(?:\s+-[^\r\n]*)?\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changeLog, $pattern)

          if (-not $match.Success) {
              throw "No changelog section found for $tag."
          }

          $releaseNotes = "# ERModsMerger $tag`r`n`r`n" + $match.Groups["body"].Value.Trim() + "`r`n"
          Set-Content -Path "artifacts/release/release-notes.md" -Value $releaseNotes -Encoding UTF8

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/release/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ERModsMerger ${{ github.ref_name }}
          body_path: artifacts/release/release-notes.md
          files: artifacts/release/*.zip
