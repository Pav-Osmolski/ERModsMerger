name: Finalize v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v1.5.0.yml'

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    name: Finalize v1.5.0 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout final release metadata
        uses: actions/checkout@v7
        with:
          ref: c8790f91ce2a9b6076fdc547f7446f00fb630664
          sparse-checkout: |
            Documentation/ChangeLog.md

      - name: Download validated main package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 35763466549 \
            --repo "$GITHUB_REPOSITORY" \
            --name "ERModsMerger-build-c8790f91ce2a9b6076fdc547f7446f00fb630664" \
            --dir artifact

          test -f "artifact/ERModsMerger-ci-c8790f91ce2a9b6076fdc547f7446f00fb630664-win-x64.zip"
          mv "artifact/ERModsMerger-ci-c8790f91ce2a9b6076fdc547f7446f00fb630664-win-x64.zip" "artifact/ERModsMerger-v1.5.0-win-x64.zip"

          unzip -l "artifact/ERModsMerger-v1.5.0-win-x64.zip" | grep -F "ChangeLog.md"
          sha256sum "artifact/ERModsMerger-v1.5.0-win-x64.zip"

      - name: Extract v1.5.0 notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# ERModsMerger v1.5.0"
            echo
            awk '
              index($0, "## v1.5.0 - ") == 1 { found=1; next }
              found && /^## / { exit }
              found { print }
            ' Documentation/ChangeLog.md
          } > artifact/release-notes.md

          grep -F "### CSV PARAM merging" artifact/release-notes.md >/dev/null

      - name: Replace v1.5.0 tag, asset and notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: c8790f91ce2a9b6076fdc547f7446f00fb630664
        run: |
          set -euo pipefail

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.5.0" \
            -f sha="$RELEASE_SHA" \
            -F force=true >/dev/null

          gh release upload v1.5.0 \
            "artifact/ERModsMerger-v1.5.0-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit v1.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "ERModsMerger v1.5.0" \
            --notes-file "artifact/release-notes.md" \
            --latest

      - name: Remove redundant stale-head validation runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 35762992297 35763228982; do
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done

      - name: Remove one-shot finalizer
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/finalize-v1.5.0.yml?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/finalize-v1.5.0.yml" \
            -f message="Remove one-shot v1.5.0 finalizer" \
            -f sha="$workflow_sha" \
            -f branch="main"
