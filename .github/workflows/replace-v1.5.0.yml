name: Replace v1.5.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-v1.5.0.yml'

permissions:
  actions: read
  contents: write

jobs:
  replace:
    name: Replace v1.5.0 with corrected build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout corrected release commit
        uses: actions/checkout@v7
        with:
          ref: f9283b9d3414935eb88bc4d7a95686ef80119d87
          sparse-checkout: |
            Documentation/ReleaseNotes-v1.5.0.md

      - name: Download validated main package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 35762163783 \
            --repo "$GITHUB_REPOSITORY" \
            --name "ERModsMerger-build-f9283b9d3414935eb88bc4d7a95686ef80119d87" \
            --dir artifact

          test -f "artifact/ERModsMerger-ci-f9283b9d3414935eb88bc4d7a95686ef80119d87-win-x64.zip"
          mv "artifact/ERModsMerger-ci-f9283b9d3414935eb88bc4d7a95686ef80119d87-win-x64.zip" "artifact/ERModsMerger-v1.5.0-win-x64.zip"
          sha256sum "artifact/ERModsMerger-v1.5.0-win-x64.zip"

      - name: Replace v1.5.0 tag, asset and notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: f9283b9d3414935eb88bc4d7a95686ef80119d87
        run: |
          set -euo pipefail

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.5.0" \
            -f sha="$RELEASE_SHA" \
            -F force=true >/dev/null

          gh release upload v1.5.0 \
            "artifact/ERModsMerger-v1.5.0-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit v1.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "ERModsMerger v1.5.0" \
            --notes-file "Documentation/ReleaseNotes-v1.5.0.md" \
            --latest

      - name: Remove one-shot replacement workflow
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/replace-v1.5.0.yml?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/replace-v1.5.0.yml" \
            -f message="Remove one-shot v1.5.0 replacement workflow" \
            -f sha="$workflow_sha" \
            -f branch="main"
