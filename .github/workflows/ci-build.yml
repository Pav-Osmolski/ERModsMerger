name: CI Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  pull_request:
    branches:
      - main
    # Avoid a CI run for every WIP commit. Draft PRs stay quiet; validation runs
    # when a PR is opened ready, reopened, or explicitly marked ready for review.
    types:
      - opened
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build .NET 8 solution
    runs-on: windows-latest

    steps:
      # PR validation does not package runtime assets, so avoid pulling the large
      # regulation archive and unrelated HKS submodule just to compile/test code.
      - name: Checkout PR sources
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          submodules: false
          filter: blob:none
          sparse-checkout: |
            ERModsMerger
            ERModsManager
            ERModsMerger.Core
            ERModsMerger.Core.Tests
            SoulsFormats

      - name: Checkout full repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # windows-latest already carries supported .NET SDKs. global.json selects
      # the required .NET 8 feature band, so PRs only need to verify it resolves.
      - name: Verify preinstalled .NET 8
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $version = (dotnet --version).Trim()
          Write-Host "Resolved .NET SDK: $version"
          if (-not $version.StartsWith("8.")) {
              throw "global.json did not resolve a .NET 8 SDK on this runner."
          }

      - name: Restore PR NuGet cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Main/manual builds keep the explicit SDK installation for reproducible
      # package generation and retain setup-dotnet's NuGet cache integration.
      - name: Set up .NET 8
        if: github.event_name != 'pull_request'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        shell: pwsh
        env:
          ERMM_SKIP_ASSETS: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: >-
          dotnet build ERModsMerger.sln
          --configuration Release
          --no-restore
          --warnaserror
          -p:ERModsMergerSkipAssets=$env:ERMM_SKIP_ASSETS

      # Full builds generate Assets.zip through Directory.Build.targets.
      - name: Validate regulation assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/Test-RegulationAssets.ps1

      - name: Test fast merge semantics
        run: >-
          dotnet test ERModsMerger.Core.Tests/ERModsMerger.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=SlowIntegration"

      # PR validation only proves code/build/test correctness. Main/manual builds
      # retain a useful compiled package with the complete runtime assets.
      - name: Build compact CI package
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/Build-ReleasePackage.ps1 -VersionLabel "ci-${{ github.sha }}"

      - name: Upload compiled package
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/*.zip

  cleanup:
    name: Prune non-successful Actions runs
    needs: build
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete obsolete non-successful Actions history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Successful runs are useful release/debug history and are never touched.
          # Completed non-successful runs are disposable noise once a healthy
          # validation run reaches this cleanup job.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[]
              | select(.conclusion == "cancelled"
                    or .conclusion == "failure"
                    or .conclusion == "timed_out"
                    or .conclusion == "startup_failure"
                    or .conclusion == "skipped"
                    or .conclusion == "stale")
              | [.id, .name, .conclusion, .created_at, .display_title]
              | @tsv' |
          while IFS="$(printf '\t')" read -r run_id workflow conclusion created_at title; do
            if [[ -z "${run_id:-}" || "$run_id" == "$CURRENT_RUN_ID" ]]; then
              continue
            fi

            echo "Deleting $workflow run $run_id ($conclusion): $title"
            if gh api --silent --method DELETE "repos/$REPO/actions/runs/$run_id"; then
              echo "Deleted run $run_id"
            else
              echo "Could not delete run $run_id; continuing"
            fi
          done
