name: CI Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  pull_request:
    branches:
      - main
    # Avoid a CI run for every WIP commit. Draft PRs stay quiet; validation runs
    # when a PR is opened ready, reopened, or explicitly marked ready for review.
    types:
      - opened
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs are intentionally queued instead of cancelling one another. With PR
  # validation gated to meaningful lifecycle events there should be no WIP spam,
  # and completed main-branch validation history remains useful.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A draft PR opened through the GitHub UI can still emit an "opened" event.
    # Skip the job until the PR is marked ready; direct/main/manual runs always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build .NET 8 solution
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate Assets.zip
        shell: pwsh
        run: ./tools/Build-AssetsArchive.ps1

      - name: Validate regulation assets
        shell: pwsh
        run: ./tools/Test-RegulationAssets.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        run: dotnet build ERModsMerger.sln --configuration Release --no-restore --warnaserror

      - name: Test semantic regulation merging
        run: dotnet test ERModsMerger.sln --configuration Release --no-build --no-restore

      # PR validation only needs to prove the code builds/tests. Package generation
      # is reserved for main/manual runs where the artifact is actually useful.
      - name: Build compact CI package
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/Build-ReleasePackage.ps1 -VersionLabel "ci-${{ github.sha }}"

      - name: Upload compiled package
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/*.zip

  cleanup:
    name: Prune obsolete CI runs
    needs: build
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete obsolete non-successful Actions history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          grace_seconds=3600

          # Successful runs are useful release/debug history and are never touched.
          # Once main is healthy, old CI Build failures/cancellations are WIP debris
          # and can go immediately. Other workflows get a one-hour diagnostic grace
          # period before their non-successful runs are pruned.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[]
              | select(.conclusion == "cancelled"
                    or .conclusion == "failure"
                    or .conclusion == "timed_out"
                    or .conclusion == "startup_failure"
                    or .conclusion == "skipped"
                    or .conclusion == "stale")
              | [.id, .name, .conclusion, .created_at, .display_title]
              | @tsv' |
          while IFS="$(printf '\t')" read -r run_id workflow conclusion created_at title; do
            if [[ -z "${run_id:-}" || "$run_id" == "$CURRENT_RUN_ID" ]]; then
              continue
            fi

            if [[ "$workflow" != "CI Build" ]]; then
              created_epoch="$(date -u -d "$created_at" +%s)"
              age_seconds=$((now_epoch - created_epoch))
              if (( age_seconds < grace_seconds )); then
                echo "Keeping recent $workflow run $run_id for diagnostics: $title"
                continue
              fi
            fi

            echo "Deleting $workflow run $run_id ($conclusion): $title"
            if gh api --silent --method DELETE "repos/$REPO/actions/runs/$run_id"; then
              echo "Deleted run $run_id"
            else
              # Some legacy runs from already-removed workflow definitions can
              # return 404 even though they still appear in the run listing.
              # Do not let one undeletable record block cleanup of the rest.
              echo "Could not delete run $run_id; continuing"
            fi
          done

