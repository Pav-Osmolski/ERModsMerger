name: CI Build

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET 8 solution
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        run: dotnet build ERModsMerger.sln --configuration Release --no-restore

      - name: Test semantic regulation merging
        run: dotnet test ERModsMerger.sln --configuration Release --no-build --no-restore

      - name: Upload compiled output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ERModsMerger/bin/Release/net8.0-windows/**
            ERModsManager/bin/Release/net8.0-windows/**
