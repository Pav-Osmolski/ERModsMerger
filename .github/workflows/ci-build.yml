name: CI Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  pull_request:
    branches:
      - main
    # Avoid a CI run for every WIP commit. Draft PRs stay quiet; validation runs
    # when a PR is opened ready, reopened, or explicitly marked ready for review.
    types:
      - opened
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'Documentation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs are intentionally queued instead of cancelling one another. With PR
  # validation gated to meaningful lifecycle events there should be no WIP spam,
  # and completed main-branch validation history remains useful.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A draft PR opened through the GitHub UI can still emit an "opened" event.
    # Skip the job until the PR is marked ready; direct/main/manual runs always run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build .NET 8 solution
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate Assets.zip
        shell: pwsh
        run: ./tools/Build-AssetsArchive.ps1

      - name: Validate regulation assets
        shell: pwsh
        run: ./tools/Test-RegulationAssets.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore ERModsMerger.sln

      - name: Build
        run: dotnet build ERModsMerger.sln --configuration Release --no-restore --warnaserror

      - name: Test semantic regulation merging
        run: dotnet test ERModsMerger.sln --configuration Release --no-build --no-restore

      # PR validation only needs to prove the code builds/tests. Package generation
      # is reserved for main/manual runs where the artifact is actually useful.
      - name: Build compact CI package
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/Build-ReleasePackage.ps1 -VersionLabel "ci-${{ github.sha }}"

      - name: Upload compiled package
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ERModsMerger-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/*.zip
